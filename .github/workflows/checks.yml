name: Project Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    # Playwright 1.58 supports Ubuntu 24.04; avoid ubuntu-latest OS migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks
          path: work/release-checks
          retention-days: 7
