name: Project Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:accounts
      - run: npm run test:import
      - run: npm run test:refresh
      - run: npm run test:starters
      - run: npm run test:live
      - run: npm run test:weekly
      - run: npm run test:futures
      - run: npm run test:reporting
      - run: npm run test:reopening
      - run: node scripts/test-audit-values.mjs
